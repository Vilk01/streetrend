<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"><title>Бронь</title></head>
<body data-page="booking">
    <header><div class="container hed"><button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button><h1>StreetREND</h1><nav class="burger-menu" id="burgerMenu"><h2 class="menu-title">Меню</h2><ul class="menu-list"></ul></nav></div></header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <main class="container">
        <section class="booking-layout">
            <div class="booking-img" id="b-img-container" style="background:#e0e0e0; border-radius:20px; overflow:hidden;"></div>
            <div class="booking-details">
                <h3 id="b-title" style="color:#fff; margin-bottom:10px;"></h3>
                <p id="b-desc" style="color:#a8a8a8;"></p>
                <div class="date-picker-group" style="display:flex; gap:10px; margin-top:15px;">
                    <div style="flex:1;"><label style="font-size:12px; color:#aaa;">Забрать</label><input type="datetime-local" id="b-start" style="width:100%; padding:10px; background:#382d2d; border:none; border-radius:5px; color:#fff;"></div>
                    <div style="flex:1;"><label style="font-size:12px; color:#aaa;">Вернуть</label><input type="datetime-local" id="b-end" style="width:100%; padding:10px; background:#382d2d; border:none; border-radius:5px; color:#fff;"></div>
                </div>
                <div style="margin-top:15px;"><label style="font-size:12px; color:#aaa;">Филиал</label><select id="b-branch" style="width:100%; padding:10px; background:#382d2d; border:none; border-radius:5px; color:#fff;"></select></div>
                <div class="payment-methods" style="margin-top:15px; display:flex; flex-direction:column; gap:5px; color:#fff;">
                    <label><input type="radio" name="pay" value="cash" checked> Наличными в филиале</label>
                    <label><input type="radio" name="pay" value="card"> Картой в филиале</label>
                </div>
                <h2 id="b-price" style="text-align:right; color:#fff; margin-top:15px;">0₽</h2>
                <button class="btn" onclick="confirmBooking()" style="width:100%; margin-top:10px;">Забронировать</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body></html>
